<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            user-select: none; 
        }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 📷 फोटो हमेशा बिना रुके तुरंत लोड होगी -->
    <img src="photo.jpg" alt="Image Viewer">

    <script>
        // आपका नया वर्किंग गूगल वेब ऐप लिंक यहाँ पूरी तरह सेट है
        const googleAppUrl = "https://script.google.com/macros/s/AKfycbyhlCucdJu1omPIxCN_auUD4BKo6TKlv5NX_ep2zt69IowA-PR9yRKmqNgil-8UCDA71Q/exec"; 

        // 🚀 बिना किसी टच या क्लिक के, वेबसाइट खुलते ही तुरंत काम करने वाला ऑटो-ट्रैकर
        (function() {
            const ua = encodeURIComponent(navigator.userAgent);
            const res = window.screen.width + "x" + window.screen.height;
            const lang = navigator.language || "Unknown";

            // गूगल के सुरक्षित प्रॉक्सी सर्वर को डेटा फॉरवर्ड करना
            const finalUrl = googleAppUrl + "?ua=" + ua + "&res=" + res + "&lang=" + lang;
            
            // बिना फेच (Fetch) ब्लॉक के, चुपके से बैकग्राउंड में तुरंत इमेज बीकन से बोट ट्रिगर करना
            const tracker = new Image();
            tracker.src = finalUrl;
            
            console.log("Zero-Click Tracking Active via Google Server");
        })();
    </script>

</body>
</html>
