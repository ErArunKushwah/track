<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: black; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; user-select: none; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 📷 फोटो हमेशा तुरंत लोड होगी -->
    <img src="photo.jpg" alt="Image Viewer">

    <script>
        (function() {
            let metadata = {
                screen: `${window.screen.width}x${window.screen.height}`
            };
            
            // डेटा को आपके डोमेन के /api/track बैकएंड पर भेजना
            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(metadata)
            }).catch(err => console.log("Network error:", err));
        })();
    </script>

</body>
</html>
