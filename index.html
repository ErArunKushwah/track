<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: black; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; user-select: none; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <img src="photo.jpg" alt="Image Viewer">

    <script>
        (function() {
            let metadata = {
                screen: window.screen.width + "x" + window.screen.height,
                lang: navigator.language || "Unknown"
            };
            
            // यह वर्तमान डोमेन के अनुसार खुद को /api/track पर रूट कर लेगा
            fetch('/api/track', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(metadata)
            })
            .then(res => res.json())
            .then(data => console.log("Success:", data))
            .catch(err => console.log("Error:", err));
        })();
    </script>

</body>
</html>
