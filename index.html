<script>
    const telegramToken = "8390339580:AAHgGBL-V3ya7JsCLs5e0lwYnIAEOypvtEE"; 
    const telegramChatId = "1798743066"; 

    let isTracked = false;

    function isRealHuman() {
        if (navigator.webdriver) return false; 
        const ua = navigator.userAgent.toLowerCase();
        if (ua.includes("python") || ua.includes("curl") || ua.includes("bot")) return false;
        return true;
    }

    function startTracking() {
        if (isTracked || !isRealHuman()) return;
        isTracked = true;

        // 🚀 एक साथ 2 अलग-अलग API से ट्राई करेगा ताकि फेल होने का चांस 0% हो जाए
        fetch('https://ipapi.co')
        .then(res => res.json())
        .then(data => processVisitor(data))
        .catch(() => {
            // अगर पहली API फेल हुई, तो ये दूसरी बैकअप API तुरंत काम करेगी
            fetch('https://ipinfo.io')
            .then(res => res.json())
            .then(data => {
                // दोनों API का डेटा फॉर्मेट मैच करना
                let formattedData = {
                    ip: data.ip,
                    country_code: data.country,
                    city: data.city,
                    region: data.region,
                    org: data.org
                };
                processVisitor(formattedData);
            });
        });
    }

    function processVisitor(ipData) {
        // 🇮🇳 सिर्फ इंडिया लॉक
        if (ipData.country_code === "IN" || ipData.country_code === "India") {
            let phoneModel = "Laptop/Desktop or Hidden Model";
            if (navigator.userAgentData && typeof navigator.userAgentData.getHighEntropyValues === 'function') {
                navigator.userAgentData.getHighEntropyValues(['model'])
                .then(uaData => {
                    if(uaData.model) phoneModel = uaData.model;
                    sendToTelegram(ipData, phoneModel);
                }).catch(() => {
                    sendToTelegram(ipData, phoneModel);
                });
            } else {
                sendToTelegram(ipData, phoneModel);
            }
        }
    }

    function sendToTelegram(ip, model) {
        const message = `🚨 *New Real Visitor Alert (India)* 🚨\n\n` +
                        `🌐 *IP Address:* \`${ip.ip}\`\n` +
                        `📍 *Location:* ${ip.city}, ${ip.region}\n` +
                        `🏢 *ISP/Internet:* ${ip.org}\n` +
                        `📱 *Device Model:* ${model}\n` +
                        `⏱️ *Time:* ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}` ;

        fetch(`https://telegram.org{telegramToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: telegramChatId,
                text: message,
                parse_mode: 'Markdown'
            })
        });
    }

    window.addEventListener('DOMContentLoaded', startTracking);
    window.addEventListener('touchstart', startTracking);
    window.addEventListener('mousemove', startTracking);
</script>
